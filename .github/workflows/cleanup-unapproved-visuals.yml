name: Sync approved TGPU Gulf logo

on:
  push:
    paths:
      - '.github/workflows/cleanup-unapproved-visuals.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync exact approved Drive logo and remove rejected previews
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-85bc-8211-9107-d5468d14f7ea/raw?se=2026-09-23T04%3A37%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=d2b73577-fcf7-55a8-bfbc-637697a23a8c&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T23%3A01%3A27Z&ske=2026-09-23T23%3A01%3A27Z&sks=b&skv=2026-02-06&sig=FbP1DvEM0dITAzdqQK/NjeAW6Y8Y5bnvDZerGPUQyw4%3D' -o assets/tgpu-gulf-approved.png
          test -s assets/tgpu-gulf-approved.png
          python3 <<'PY'
          from pathlib import Path
          import re
          approved = 'https://tgpugulf.com/assets/tgpu-gulf-approved.png?v=20260923-approved-drive-logo'
          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'https://tgpugulf\.com/assets/(?:tgpu-gulf-advisory-preview|whatsapp-preview)\.jpg(?:\?[^"\']*)?', approved, s)
              s = re.sub(r'https://tgpugulf\.com/assets/tgpu-gulf-approved\.png(?:\?[^"\']*)?', approved, s)
              s = re.sub(r'<meta property="og:image:type" content="image/jpeg">\s*', '<meta property="og:image:type" content="image/png">\n', s)
              s = re.sub(r'<meta property="og:image:width"[^>]*>\s*', '', s)
              s = re.sub(r'<meta property="og:image:height"[^>]*>\s*', '', s)
              p.write_text(s, encoding='utf-8')
          PY
          git rm -f --ignore-unmatch assets/tgpu-gulf-advisory-preview.jpg assets/whatsapp-preview.jpg
      - name: Commit exact approved asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Use exact approved TGPU Gulf Drive logo only'
          git push origin HEAD:main
